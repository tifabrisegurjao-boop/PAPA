# Publica a DEMONSTRAÇÃO (build:demo: sem login, base fictícia, sem Firebase) no GitHub Pages.
#
# O que vai ao ar vem SEMPRE do branch `demo` (MVP congelado em 28/09/2026, o que a chefia recebeu por link) — nunca da `main`.
# A `main` segue evoluindo para a produção (Firestore, dado real) sem alterar a demo. O gatilho continua sendo push na `main`
# (ou "Run workflow" à mão) porque o ambiente github-pages só aceita deploy disparado a partir da `main`.
# Para atualizar a demo: leve a mudança ao branch `demo` (merge/cherry-pick) e `git push origin demo main`.
#
# Em Settings › Pages, a fonte precisa ser "GitHub Actions" (o passo configure-pages liga isso sozinho na 1ª vez).
# O site fica em https://<conta>.github.io/PAPA/ — os caminhos do build são relativos (base: './'), então funciona na subpasta.
name: Demo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: O branch demo precisa estar no GitHub
        run: |
          # Com o token do job a consulta funciona também se o repositório virar privado.
          git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" demo >/dev/null; codigo=$?
          if [ "$codigo" = 2 ]; then echo "::error::O branch 'demo' (conteúdo da demonstração) não está no GitHub. Rode: git push origin demo"; exit 1; fi
          if [ "$codigo" != 0 ]; then echo "::error::Não consegui consultar os branches do GitHub (código $codigo)."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: demo # conteúdo congelado da demonstração (ver cabeçalho)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A base FICTÍCIA dados/base.json está commitada de propósito no branch `demo`; se faltar, sai a base pequena do exemplo.
      - name: Base de dados da demo
        run: |
          if [ -f dados/base.json ]; then echo "usando dados/base.json do branch demo"; else npm run dados:exemplo; fi
      - run: npm test
      - run: npm run build:demo
      - run: touch dist-demo/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
